name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Pytest (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-py311.lock.txt"

      - name: Install locked Python dependencies with hash verification
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r backend/requirements-py311.lock.txt

      - name: Run full backend pytest suite
        working-directory: backend
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          pytest tests -q --tb=short

  frontend-check:
    name: Frontend Test & Build (Node.js 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Clean install, test, and build
        run: |
          npm ci
          npm test
          npm run build

  mysql-migration:
    name: MySQL 8.0.46 Migration & Startup Validation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: ci_mysql_root_password_2026
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_mysql_root_password_2026 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-py311.lock.txt"

      - name: Install locked Python dependencies with hash verification
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r backend/requirements-py311.lock.txt

      - name: Run MySQL migration, startup control, and constraint validations
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_USER: "root"
          MYSQL_PASSWORD: "ci_mysql_root_password_2026"
          ADMIN_USERNAME: "ci_admin_test"
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          python backend/scripts/validation/validate_mysql_p0_2.py --mode ci-container --output /tmp/mysql_p0_2_ci_result.json
